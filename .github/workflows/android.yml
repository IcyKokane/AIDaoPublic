name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate update metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          gradle = pathlib.Path("android-bootstrap/app/build.gradle.kts").read_text()
          metadata = json.loads(pathlib.Path("updates/latest.json").read_text())
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not name_match or not code_match:
              raise SystemExit("Unable to read Android version from build.gradle.kts")
          version_name = name_match.group(1)
          version_code = int(code_match.group(1))
          if metadata.get("version") != version_name:
              raise SystemExit(f"Update metadata version {metadata.get('version')} does not match {version_name}")
          if metadata.get("versionCode") != version_code:
              raise SystemExit(f"Update metadata versionCode {metadata.get('versionCode')} does not match {version_code}")
          if metadata.get("channel") != "alpha":
              raise SystemExit("Update metadata channel must remain alpha for this workflow")
          url = metadata.get("downloadUrl", "")
          if not url.startswith("https://github.com/IcyKokane/AIDaoPublic/"):
              raise SystemExit("downloadUrl must stay inside the official AIDaoPublic GitHub repository")
          print(f"Validated AIDao {version_name} ({version_code}) update metadata")
          PY

      - name: Validate Android usability safeguards
        run: |
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path("android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivity.java").read_text()
          theme = pathlib.Path("android-bootstrap/app/src/main/res/values/styles.xml").read_text()
          required_source = {
              "edge-to-edge window fitting": "setDecorFitsSystemWindows(false)",
              "system bar insets": "WindowInsets.Type.systemBars()",
              "display cutout insets": "WindowInsets.Type.displayCutout()",
              "IME insets": "WindowInsets.Type.ime()",
              "legacy IME fallback": "installLegacyImeDetector()",
              "bottom navigation IME protection": "bottomNav.setVisibility(imeVisible ? View.GONE : View.VISIBLE)",
              "official update source": "https://raw.githubusercontent.com/IcyKokane/AIDaoPublic/main/updates/latest.json",
              "trusted update repository": "/IcyKokane/AIDaoPublic/",
              "user-controlled update action": "Open verified build page",
              "functional sans-serif text": "Typeface.create(\"sans\"",
          }
          missing = [name for name, marker in required_source.items() if marker not in source]
          required_theme = {
              "dark status bar": "android:windowLightStatusBar\">false",
              "dark navigation bar": "android:windowLightNavigationBar\">false",
              "display cutout support": "android:windowLayoutInDisplayCutoutMode\">shortEdges",
          }
          missing += [name for name, marker in required_theme.items() if marker not in theme]
          if missing:
              raise SystemExit("Android usability regression: " + ", ".join(missing))
          print("Validated Android edge-to-edge, IME, navigation, typography, and update safeguards")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build alpha APK
        working-directory: android-bootstrap
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-alpha-debug
          path: android-bootstrap/app/build/outputs/apk/debug/app-debug.apk
