name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify AIDao source
        run: |
          mkdir -p .work
          cat source/b64/part*.txt | tr -d '[:space:]' | base64 --decode > .work/AIDao-android-v0.11.0.zip
          echo "ea55d8e48a1fff76278152677abf65eb36c787f55d7b6e1d3dded366abeba0e8  .work/AIDao-android-v0.11.0.zip" | sha256sum --check
          unzip -t .work/AIDao-android-v0.11.0.zip
          unzip -q .work/AIDao-android-v0.11.0.zip -d .work

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests
        working-directory: .work/AIDao-android-v0.11.0
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: .work/AIDao-android-v0.11.0
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-debug
          path: .work/AIDao-android-v0.11.0/app/build/outputs/apk/debug/app-debug.apk
