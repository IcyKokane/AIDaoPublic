name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate update metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          gradle = pathlib.Path("android-bootstrap/app/build.gradle.kts").read_text()
          metadata = json.loads(pathlib.Path("updates/latest.json").read_text())
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not name_match or not code_match:
              raise SystemExit("Unable to read Android version")
          version_name, version_code = name_match.group(1), int(code_match.group(1))
          if metadata.get("version") != version_name or metadata.get("versionCode") != version_code:
              raise SystemExit("Update metadata does not match Android version")
          if metadata.get("channel") != "alpha":
              raise SystemExit("Update metadata channel must remain alpha")
          if not metadata.get("downloadUrl", "").startswith("https://github.com/IcyKokane/AIDaoPublic/"):
              raise SystemExit("downloadUrl must stay inside AIDaoPublic")
          print(f"Validated AIDao {version_name} ({version_code})")
          PY

      - name: Validate Android usability and generation safeguards
        run: |
          python3 - <<'PY'
          import pathlib, re
          base = pathlib.Path("android-bootstrap/app/src/main/java/dev/thefoolish/aidao")
          manifest = pathlib.Path("android-bootstrap/app/src/main/AndroidManifest.xml").read_text()
          match = re.search(r'android:name="\.([A-Za-z0-9_]+)"', manifest)
          if not match:
              raise SystemExit("Unable to determine launcher activity")
          source = (base / (match.group(1) + ".java")).read_text()
          theme = pathlib.Path("android-bootstrap/app/src/main/res/values/styles.xml").read_text()
          task_state = (base / "TaskExecutionState.java").read_text()
          planner = (base / "ProjectPlanner.java").read_text().lower()
          generator = (base / "LocalSourceGenerator.java").read_text()
          github_client = (base / "GitHubGeneratedBuildClient.java").read_text()
          repairer = (base / "GeneratedProjectRepairer.java").read_text()
          required_source = {
              "edge-to-edge": "setDecorFitsSystemWindows(false)",
              "system bars": "WindowInsets.Type.systemBars()",
              "display cutout": "WindowInsets.Type.displayCutout()",
              "IME": "WindowInsets.Type.ime()",
              "IME navigation protection": "bottom.setVisibility(ime?View.GONE:View.VISIBLE)",
              "readable sans UI": "Typeface.create(\"sans-serif\"",
              "persistent workspace": "aidao_workspace_v4",
              "natural-language project creation": "Describe what you want in ordinary language.",
              "real source generation": "Generate Real Android Source",
              "generated file workspace": "Generated project files",
              "user-controlled GitHub send": "Send Generated Source & Build",
              "session-only credential": "sessionToken=\"\"",
              "CI state": "ci_state",
              "APK-ready state": "APK READY",
              "execution-owned task explanation": "They are not manual checkboxes",
          }
          missing = [k for k,v in required_source.items() if v not in source]
          state_markers = ["PLANNED", "IN_PROGRESS", "VERIFYING", "COMPLETE", "BLOCKED"]
          missing += ["task state " + s for s in state_markers if s not in task_state]
          domain_markers = ["anime catalog", "episode discovery", "watch history", "provider failure isolation"]
          missing += ["domain planning " + s for s in domain_markers if s not in planner]
          generated_markers = ["settings.gradle.kts", "app/build.gradle.kts", "AndroidManifest.xml", "styles.xml", ".github/workflows/android.yml"]
          missing += ["generated file " + s for s in generated_markers if s not in generator]
          transport_markers = ["isolated branch", "sendBuildAndWait", "actions/runs", "artifacts", "default branch is never modified"]
          missing += ["GitHub transport " + s for s in transport_markers if s not in github_client]
          repair_markers = ["Repair Android theme/resource linkage only", "Repair generated Gradle plugin/toolchain compatibility only"]
          missing += ["bounded repair " + s for s in repair_markers if s not in repairer]
          for k,v in {"dark status bar":"android:windowLightStatusBar\">false","dark nav bar":"android:windowLightNavigationBar\">false","cutout support":"android:windowLayoutInDisplayCutoutMode\">shortEdges"}.items():
              if v not in theme: missing.append(k)
          if missing:
              raise SystemExit("Android generation/workflow regression: " + ", ".join(missing))
          print("Validated end-to-end generation workspace, execution-owned tasks, Android insets, user-controlled GitHub boundary, and bounded repair path")
          PY

      - name: Validate AI provider safety boundary
        run: |
          python3 - <<'PY'
          import pathlib
          base = pathlib.Path("android-bootstrap/app/src/main/java/dev/thefoolish/aidao")
          provider = (base / "ModelProvider.java").read_text()
          local = (base / "LocalPlanningProvider.java").read_text()
          registry = (base / "ProviderRegistry.java").read_text()
          planner = (base / "ProjectPlanner.java").read_text()
          generator = (base / "LocalSourceGenerator.java").read_text()
          github_client = (base / "GitHubGeneratedBuildClient.java").read_text()
          joined = "\n".join([provider, local, registry, planner, generator, github_client])
          required = {
              "provider request boundary": "final class Request",
              "provider result boundary": "final class Result",
              "offline default": "AIDao Local Planner",
              "remote flag": "boolean isRemote()",
              "safe action boundary": "never install APKs, publish code, spend money, or perform destructive actions",
              "local planner use": "ProjectPlanner.build",
              "registry local default": "new LocalPlanningProvider()",
              "local source safety": "never installs APKs",
              "token not persisted": "Tokens are never\n * persisted by this class",
              "isolated generated branch": "default branch is never modified or deleted",
          }
          missing = [name for name, marker in required.items() if marker not in joined]
          if missing: raise SystemExit("AI/provider safety regression: " + ", ".join(missing))
          print("Validated local-first model boundary, local source safety, and explicit GitHub credential boundary")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate acceptance Android project from AIDao source generator
        run: |
          rm -rf build/source-generator generated-acceptance
          mkdir -p build/source-generator generated-acceptance
          javac -d build/source-generator \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java \
            acceptance/GenerateSampleProject.java
          java -cp build/source-generator dev.thefoolish.aidao.GenerateSampleProject "$PWD/generated-acceptance"
          test -f generated-acceptance/app/src/main/AndroidManifest.xml
          test -f generated-acceptance/app/src/main/res/values/styles.xml
          test -f generated-acceptance/.github/workflows/android.yml

      - name: Build AIDao-generated acceptance APK
        working-directory: generated-acceptance
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload generated acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-generated-acceptance-apk
          path: generated-acceptance/app/build/outputs/apk/debug/app-debug.apk

      - name: Build alpha APK
        working-directory: android-bootstrap
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-alpha-debug
          path: android-bootstrap/app/build/outputs/apk/debug/app-debug.apk
