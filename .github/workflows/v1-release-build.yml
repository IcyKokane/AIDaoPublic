name: AIDao V1 Release Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v1 release identity
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          gradle = pathlib.Path('android-bootstrap/app/build.gradle.kts').read_text()
          ui = pathlib.Path('android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV5.java').read_text()
          metadata = json.loads(pathlib.Path('updates/latest.json').read_text())
          if 'versionCode = 100' not in gradle or 'versionName = "1.0.0"' not in gradle:
              raise SystemExit('Android package is not identified as AIDao 1.0.0 / versionCode 100')
          if metadata.get('version') != '1.0.0' or metadata.get('versionCode') != 100:
              raise SystemExit('Update metadata is not identified as AIDao 1.0.0 / versionCode 100')
          if 'Developer workspace · v1.0' not in ui:
              raise SystemExit('Visible workspace version label is not v1.0')
          print('AIDao v1 release identity verified')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build AIDao v1 APK
        working-directory: android-bootstrap
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload AIDao v1 APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-v1-debug
          path: android-bootstrap/app/build/outputs/apk/debug/app-debug.apk
