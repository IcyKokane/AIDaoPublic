name: Generated Product Quality Matrix

on:
  push:
    paths:
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneralProductPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java'
      - 'acceptance/GenerateQualityMatrixProjects.java'
      - '.github/workflows/generated-quality-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate varied nontrivial Android products
        run: |
          rm -rf build/quality-generator generated-quality
          mkdir -p build/quality-generator generated-quality
          javac -d build/quality-generator \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneralProductPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java \
            acceptance/GenerateQualityMatrixProjects.java
          java -cp build/quality-generator dev.thefoolish.aidao.GenerateQualityMatrixProjects "$PWD/generated-quality"
          ! grep -R -q 'Save local sample state\|sample state\|android\.widget\.android\.widget\.' generated-quality/app generated-quality 2>/dev/null || exit 1

      - name: Build finance product APK
        working-directory: generated-quality/finance
        run: gradle :app:assembleDebug --stacktrace

      - name: Build tracker product APK
        working-directory: generated-quality/tracker
        run: gradle :app:assembleDebug --stacktrace

      - name: Build content product APK
        working-directory: generated-quality/content
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload quality matrix APKs
        uses: actions/upload-artifact@v4
        with:
          name: generated-quality-matrix-apks
          path: |
            generated-quality/finance/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/tracker/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/content/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
