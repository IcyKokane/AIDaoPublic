name: Generated Product Quality Matrix

on:
  push:
    paths:
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/NativeFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/MihonBehaviorPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedFidelityValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityResearch.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityIntegrator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneralProductPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GenericOfflinePostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/SemanticProductPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java'
      - 'acceptance/GenerateQualityMatrixProjects.java'
      - '.github/workflows/generated-quality-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expose quality run marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="aidao-quality-run-${GITHUB_RUN_ID}"
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          parent_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq '.object.sha')
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${branch}" -f sha="${parent_sha}" >/dev/null
          echo "Quality run marker: $branch"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate varied nontrivial Android products
        run: |
          rm -rf build/quality-generator generated-quality
          mkdir -p build/quality-generator generated-quality
          javac -d build/quality-generator \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/NativeFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/MihonBehaviorPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedFidelityValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityResearch.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityIntegrator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneralProductPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GenericOfflinePostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/SemanticProductPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java \
            acceptance/GenerateQualityMatrixProjects.java
          java -cp build/quality-generator dev.thefoolish.aidao.GenerateQualityMatrixProjects "$PWD/generated-quality"
          ! grep -R -q 'Save local sample state\|sample state\|placeholder data\|android\.widget\.android\.widget\.' generated-quality 2>/dev/null || exit 1
          for project in finance tracker content social commerce grocery; do
            grep -q 'android:icon="@mipmap/ic_launcher"' "generated-quality/${project}/app/src/main/AndroidManifest.xml"
            grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "generated-quality/${project}/app/src/main/AndroidManifest.xml"
            test -f "generated-quality/${project}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
            test -f "generated-quality/${project}/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
            grep -R -q 'WindowInsets.Type.systemBars' "generated-quality/${project}/app/src/main/java"
            grep -R -q 'WindowInsets.Type.ime' "generated-quality/${project}/app/src/main/java"
            grep -R -q 'ScrollView' "generated-quality/${project}/app/src/main/java"
          done

      - name: Build finance product APK
        working-directory: generated-quality/finance
        run: gradle :app:assembleDebug --stacktrace
      - name: Build tracker product APK
        working-directory: generated-quality/tracker
        run: gradle :app:assembleDebug --stacktrace
      - name: Build content product APK
        working-directory: generated-quality/content
        run: gradle :app:assembleDebug --stacktrace
      - name: Build social product APK
        working-directory: generated-quality/social
        run: gradle :app:assembleDebug --stacktrace
      - name: Build commerce product APK
        working-directory: generated-quality/commerce
        run: gradle :app:assembleDebug --stacktrace
      - name: Build grocery product APK
        working-directory: generated-quality/grocery
        run: gradle :app:assembleDebug --stacktrace

      - name: Exercise six products through trusted repository_dispatch CI
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          project_root='.aidao-generated-project'
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          parent_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq '.object.sha')
          cleanup_file="$RUNNER_TEMP/aidao-quality-branches.txt"
          : > "$cleanup_file"
          for sample in finance tracker content social commerce grocery; do
            branch="aidao-generated-quality-${sample}-${GITHUB_RUN_ID}"
            echo "$branch" >> "$cleanup_file"
            echo "Creating isolated quality branch: $branch"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${branch}" -f sha="${parent_sha}" >/dev/null
            uploaded=0
            while IFS= read -r -d '' file; do
              rel="${file#generated-quality/${sample}/}"
              case "$rel" in .github/workflows/*) continue ;; esac
              encoded=$(base64 -w0 "$file")
              api_path="repos/${GITHUB_REPOSITORY}/contents/${project_root}/${rel}"
              jq -n --arg message "AIDao quality ${sample}: ${rel}" --arg content "$encoded" --arg branch "$branch" '{message:$message,content:$content,branch:$branch}' | gh api --method PUT "$api_path" --input - >/dev/null
              uploaded=$((uploaded+1))
            done < <(find "generated-quality/${sample}" -type f -not -path '*/build/*' -print0)
            [[ "$uploaded" -ge 10 ]] || { echo "$sample upload was unexpectedly small: $uploaded files"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/contents/${project_root}/settings.gradle.kts?ref=${branch}" --jq '.sha' >/dev/null
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${project_root}/.github/workflows/android.yml?ref=${branch}" >/dev/null 2>&1; then echo "Generated workflows must not cross the trusted build boundary"; exit 1; fi
            payload=$(printf '{"event_type":"aidao-generated-build","client_payload":{"target_branch":"%s","project_name":"AIDao Quality %s","project_root":"%s"}}' "$branch" "$sample" "$project_root")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - <<< "$payload"
            run_id=''
            for attempt in $(seq 1 60); do
              runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/generated-project.yml/runs?event=repository_dispatch&per_page=60")
              run_id=$(jq -r --arg b "$branch" '.workflow_runs[] | select(.display_title | contains($b)) | .id' <<< "$runs" | head -n1)
              [[ -n "$run_id" && "$run_id" != 'null' ]] && break
              sleep 5
            done
            [[ -n "$run_id" && "$run_id" != 'null' ]] || { echo "No trusted generated build appeared for $sample"; exit 1; }
            conclusion=''
            for attempt in $(seq 1 180); do
              run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
              status=$(jq -r '.status' <<< "$run")
              conclusion=$(jq -r '.conclusion // ""' <<< "$run")
              echo "$sample trusted run ${run_id}: ${status}${conclusion:+ / ${conclusion}}"
              [[ "$status" == 'completed' ]] && break
              sleep 5
            done
            [[ "$conclusion" == 'success' ]] || { echo "$sample trusted build failed: ${conclusion:-unknown}"; exit 1; }
            artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=20")
            artifact_name=$(jq -r '.artifacts[0].name // ""' <<< "$artifacts")
            [[ "$artifact_name" == aidao-generated-apk-* ]] || { echo "$sample did not produce the trusted APK artifact"; exit 1; }
            echo "$sample trusted APK: $artifact_name"
          done
          echo "cleanup_file=$cleanup_file" >> "$GITHUB_OUTPUT"

      - name: Remove quality-matrix generated branches and run marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_FILE: ${{ steps.trusted.outputs.cleanup_file }}
        shell: bash
        run: |
          set +e
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/aidao-quality-run-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          if [[ -n "$CLEANUP_FILE" && -f "$CLEANUP_FILE" ]]; then
            while IFS= read -r branch; do [[ -n "$branch" ]] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true; done < "$CLEANUP_FILE"
          else
            for sample in finance tracker content social commerce grocery; do branch="aidao-generated-quality-${sample}-${GITHUB_RUN_ID}"; gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true; done
          fi

      - name: Upload quality matrix APKs
        uses: actions/upload-artifact@v4
        with:
          name: generated-quality-matrix-apks
          path: |
            generated-quality/finance/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/tracker/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/content/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/social/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/commerce/app/build/outputs/apk/debug/app-debug.apk
            generated-quality/grocery/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error