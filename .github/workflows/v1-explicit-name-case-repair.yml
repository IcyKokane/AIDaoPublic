name: V1 Explicit Name Case Repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-explicit-name-case-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve original-case request text for explicit product names
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java')
          s = p.read_text()
          old1 = '        String request = requestText(source).toLowerCase(Locale.US);\n'
          new1 = '        String rawRequest = requestText(source);\n        String request = rawRequest.toLowerCase(Locale.US);\n'
          old2 = '        String name = inferName(projectName, request, note, workout, pantry);\n'
          new2 = '        String name = inferName(projectName, rawRequest, note, workout, pantry);\n'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected request-fidelity identity fragments not found; refusing broad rewrite')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit repair
        run: |
          git rm .github/workflows/v1-explicit-name-case-repair.yml
          git config user.name "AIDao V1 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java
          git commit -m "Preserve explicit request-name casing through fidelity generation"
          git push origin HEAD:main
