name: Planner Behavior Acceptance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner-behavior:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile local planner acceptance
        run: |
          rm -rf build/planner-acceptance
          mkdir -p build/planner-acceptance
          javac -d build/planner-acceptance \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProjectPlanner.java \
            acceptance/PlannerBehaviorAcceptance.java

      - name: Exercise natural-language planner behavior and safety boundaries
        run: java -cp build/planner-acceptance dev.thefoolish.aidao.PlannerBehaviorAcceptance
