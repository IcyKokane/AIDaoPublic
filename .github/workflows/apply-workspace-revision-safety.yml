name: Apply Workspace Revision Safety

on:
  push:
    paths:
      - '.github/workflows/apply-workspace-revision-safety.yml'
      - 'scripts/apply_workspace_revision_safety.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source patch
        run: python scripts/apply_workspace_revision_safety.py
      - name: Verify revision safety wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'override-base::' android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV5.java
          grep -q 'GeneratedProjectOverrideResolver' android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV5.java
          grep -q 'GeneratedProjectOverrideResolver' android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV6.java
          grep -q 'Manual source edits conflict with regenerated source' android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV6.java
      - name: Commit patched workspace sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV5.java android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV6.java; then
            echo 'Workspace sources already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV5.java android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV6.java
          git commit -m 'Wire revision-safe manual overrides into phone build path'
          git push origin HEAD:main
