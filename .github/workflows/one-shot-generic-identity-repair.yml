name: One-shot Generic Identity Repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-generic-identity-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch generic identity-only request path
        shell: python
        run: |
          from pathlib import Path
          p = Path('android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java')
          s = p.read_text()
          old = '  if(!note&&!workout&&!logo&&!sidebar&&!purple&&!red)return new Result(projectName,packageName,source,new ArrayList<>());'
          new = '''  if(!note&&!workout&&!logo&&!sidebar&&!purple&&!red){
   String name=inferGenericName(projectName);if(name.equals(projectName))return new Result(projectName,packageName,source,new ArrayList<>());List<GeneratedProject.FileEntry> out=new ArrayList<>();
   for(GeneratedProject.FileEntry f:source){if(f==null)continue;if("app/src/main/res/values/strings.xml".equals(f.path)||"app/src/main/AndroidManifest.xml".equals(f.path))continue;out.add(f);}out.add(file("app/src/main/res/values/strings.xml",strings(name),"Normalize prompt-like product identity"));out.add(file("app/src/main/AndroidManifest.xml",manifest(source,name,false),"Synchronize concise launcher identity"));List<String> notes=new ArrayList<>();notes.add("PASS generic prompt identity normalized to "+name+" without changing product behavior");return new Result(name,packageName,out,notes);
  }'''
          if old not in s:
              raise SystemExit('target early-return not found')
          s = s.replace(old, new, 1)
          marker = ' private static String explicitName(String request){'
          helper = ''' private static String inferGenericName(String p){
  String x=p==null?"":p.trim();String low=x.toLowerCase(Locale.US);boolean promptLike=low.startsWith("create ")||low.startsWith("make ")||low.startsWith("build ")||low.startsWith("develop ")||low.contains(" should ")||low.contains(" that ")||x.endsWith(".")||wordCount(x)>5;if(!promptLike&&x.length()>=2&&x.length()<=32)return x;
  x=x.replaceFirst("(?i)^(create|make|build|develop)\\s+","").replaceFirst("(?i)^(a|an|the)\\s+","").replaceFirst("(?i)^simple\\s+","").trim();String xl=x.toLowerCase(Locale.US);int cut=xl.indexOf(" app ");if(cut<0)cut=xl.indexOf(" application ");if(cut<0&&xl.endsWith(" app"))cut=x.length()-4;if(cut<0&&xl.endsWith(" application"))cut=x.length()-12;if(cut>0)x=x.substring(0,cut).trim();x=x.replaceFirst("(?i)^(a|an|the)\\s+","").replaceFirst("(?i)^simple\\s+","").trim();if(x.isEmpty()||wordCount(x)>5||x.length()>32)return "Generated App";return titleCaseName(x);
 }
'''
          if marker not in s:
              raise SystemExit('explicitName marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java
          git commit -m "Normalize generic prompt identity before source handoff"
          git push

# one-shot trigger refresh
