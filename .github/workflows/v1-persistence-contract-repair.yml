name: V1 Persistence Contract Repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-persistence-contract-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize generated LocalStore persistence contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java')
          s = p.read_text()
          old = ' public String text(String k,String d){return p.getString(k,d);} public void text(String k,String v){p.edit().putString(k,v==null?"":""+v).apply();} }\\n";}'
          # Current source does not concatenate v; use the exact canonical fragment below.
          old = ' public String text(String k,String d){return p.getString(k,d);} public void text(String k,String v){p.edit().putString(k,v==null?"":v).apply();} }\\n";}'
          new = ' public String text(String k,String d){return p.getString(k,d);} public void text(String k,String v){p.edit().putString(k,v==null?"":v).apply();} public void putText(String k,String v){text(k,v);} public void putNumber(String k,int v){number(k,v);} }\\n";}'
          if old not in s:
              raise SystemExit('Expected LocalStore persistence fragment not found; refusing broad rewrite')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit repair
        run: |
          git rm .github/workflows/v1-persistence-contract-repair.yml
          git config user.name "AIDao V1 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java
          git commit -m "Stabilize generated persistence compatibility API"
          git push origin HEAD:main
