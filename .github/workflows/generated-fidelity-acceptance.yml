name: Generated App Fidelity Acceptance

on:
  push:
    paths:
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedFidelityValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java'
      - 'acceptance/GenerateFidelitySampleProject.java'
      - '.github/workflows/generated-fidelity-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate fidelity acceptance Android project
        run: |
          rm -rf build/fidelity-generator generated-fidelity
          mkdir -p build/fidelity-generator generated-fidelity
          javac -d build/fidelity-generator \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedFidelityValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java \
            acceptance/GenerateFidelitySampleProject.java
          java -cp build/fidelity-generator dev.thefoolish.aidao.GenerateFidelitySampleProject "$PWD/generated-fidelity"
          test -f generated-fidelity/app/src/main/AndroidManifest.xml
          test "$(find generated-fidelity/app/src/main/java -type f | wc -l)" -ge 17
          ! grep -R -q 'Origin Path\|Sky Archive\|sample data only' generated-fidelity/app/src/main || exit 1
          grep -R -q 'ExtensionRepositoryClient' generated-fidelity/app/src/main/java
          grep -R -q 'RepositoriesActivity' generated-fidelity/app/src/main/java

      - name: Build materially improved generated APK
        working-directory: generated-fidelity
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload fidelity APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-generated-fidelity-anishelf-apk
          path: generated-fidelity/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build AIDao APK containing fidelity generator
        working-directory: android-bootstrap
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload AIDao fidelity APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-fidelity-generator-apk
          path: android-bootstrap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
