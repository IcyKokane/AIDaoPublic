name: Integrate GitHub App UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch validated workspace GitHub tab
        run: python3 tools/integrate_github_app_ui.py
      - name: Commit migration if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "AIDao CI"
          git config user.email "aidao-ci@users.noreply.github.com"
          git add android-bootstrap/app/src/main/java/dev/thefoolish/aidao/AIDaoActivityV5.java
          git commit -m "Replace normal PAT UI with GitHub App Device Flow"
          git push origin HEAD:main
