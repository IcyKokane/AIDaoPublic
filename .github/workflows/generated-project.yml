name: Generated Project CI
run-name: AIDao generated ${{ github.event.client_payload.target_branch }}

on:
  repository_dispatch:
    types: [aidao-generated-build]

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
  REQUESTED_PROJECT_ROOT: ${{ github.event.client_payload.project_root }}

jobs:
  build-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_BRANCH" =~ ^aidao-generated-[a-z0-9-]+-[0-9]+$ ]]; then
            echo "Invalid generated branch: $TARGET_BRANCH"
            exit 1
          fi
          if [[ -n "$REQUESTED_PROJECT_ROOT" && "$REQUESTED_PROJECT_ROOT" != ".aidao-generated-project" ]]; then
            echo "Invalid generated project root: $REQUESTED_PROJECT_ROOT"
            exit 1
          fi

      - name: Checkout generated project branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Resolve generated project root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ".aidao-generated-project/settings.gradle.kts" || -f ".aidao-generated-project/settings.gradle" ]]; then
            root=".aidao-generated-project"
          elif [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            # Backward-compatible with v0.5 acceptance branches while v1 transport rolls out.
            root="."
          else
            echo "No generated Android project root found"
            exit 1
          fi
          echo "project_root=$root" >> "$GITHUB_OUTPUT"
          echo "Resolved generated project root: $root"

      - name: Validate generated project boundary
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/settings.gradle.kts" -o -f "$PROJECT_ROOT/settings.gradle"
          test -f "$PROJECT_ROOT/app/build.gradle.kts" -o -f "$PROJECT_ROOT/app/build.gradle"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          if [[ -d "$PROJECT_ROOT/.github/workflows" ]]; then
            echo "Generated project may not supply executable GitHub workflows"
            exit 1
          fi

      - name: Normalize and validate generated Java source hygiene
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          src="$PROJECT_ROOT/app/src/main/java"
          if [[ -d "$src" ]]; then
            while IFS= read -r -d '' file; do
              # Defense in depth: collapse package qualifiers that a source-rewrite pass
              # may have accidentally applied more than once.
              while grep -qE 'android\.widget\.android\.widget\.|android\.graphics\.android\.graphics\.|android\.content\.android\.content\.|android\.app\.android\.app\.' "$file"; do
                sed -Ei \
                  -e 's/android\.widget\.android\.widget\./android.widget./g' \
                  -e 's/android\.graphics\.android\.graphics\./android.graphics./g' \
                  -e 's/android\.content\.android\.content\./android.content./g' \
                  -e 's/android\.app\.android\.app\./android.app./g' \
                  "$file"
              done
            done < <(find "$src" -type f -name '*.java' -print0)
            if grep -R -nE 'android\.widget\.android\.widget\.|android\.graphics\.android\.graphics\.|android\.content\.android\.content\.|android\.app\.android\.app\.' "$src"; then
              echo "Repeated Android package qualifier survived normalization"
              exit 1
            fi
            if grep -R -nE 'Save local sample state|placeholder data|sample data only|Playback surface placeholder|DemoProvider' "$src"; then
              echo "Generated executable source still contains fake-completion or placeholder behavior"
              exit 1
            fi
          fi

      - name: Validate explicit request fidelity before APK ready
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os, sys

          root = Path(os.environ["PROJECT_ROOT"])
          readme = (root / "README.md").read_text(errors="ignore") if (root / "README.md").exists() else ""
          request = readme.lower()
          manifest_path = root / "app/src/main/AndroidManifest.xml"
          manifest = manifest_path.read_text(errors="ignore") if manifest_path.exists() else ""
          strings_path = root / "app/src/main/res/values/strings.xml"
          strings = strings_path.read_text(errors="ignore") if strings_path.exists() else ""
          java_root = root / "app/src/main/java"
          java = "\n".join(p.read_text(errors="ignore") for p in java_root.rglob("*.java")) if java_root.exists() else ""
          res_root = root / "app/src/main/res"
          resources = "\n".join(p.read_text(errors="ignore") for p in res_root.rglob("*.xml")) if res_root.exists() else ""
          all_text = (java + "\n" + resources).lower()
          failures = []

          m = re.search(r'<string\s+name="app_name">\s*([^<]+?)\s*</string>', strings, re.I)
          app_name = m.group(1).strip() if m else ""
          lower_name = app_name.lower()
          if not (2 <= len(app_name) <= 40) or lower_name.startswith(("create ", "make ", "build ")) or " should " in lower_name:
              failures.append(f"generated app identity is not concise: {app_name!r}")

          def mentions(*terms):
              return any(t in request for t in terms)

          if mentions("app logo", "app icon", " logo", " icon"):
              declared = "android:icon=" in manifest or "android:roundicon=" in manifest.lower()
              icon_files = [p.name.lower() for p in res_root.rglob("*") if p.is_file()] if res_root.exists() else []
              resource = any(("ic_launcher" in n or "ic_generated_app" in n or "ic_app" in n) and n.endswith((".xml", ".png", ".webp")) for n in icon_files)
              if not (declared and resource):
                  failures.append("explicit app logo/icon request is not generated and wired")

          if mentions("sidebar", "side bar", "navigation drawer", "drawer navigation"):
              sidebar = any(t in java for t in ("DrawerLayout", "NavigationView", "sideNav", "sidebarNav", "SIDE_NAV"))
              visible_rail = "LinearLayout.HORIZONTAL" in java and any(t in java for t in ("dp(104)", "dp(96)", "dp(112)", "DrawerLayout"))
              if not (sidebar and visible_rail):
                  failures.append("explicit sidebar/drawer navigation request is not represented by a visible side navigation surface")

          if "purple" in request and not any(t in all_text for t in ("#6", "#7", "#8", "purple", "violet", "0xff7c3aed", "0xffa855f7")):
              failures.append("requested purple visual direction is missing")
          if "red" in request and not any(t in all_text for t in ("#e", "#f", "red", "crimson", "0xffef4444")):
              failures.append("requested red visual direction is missing")

          if mentions("lock notes", "lock note", "can't be edited", "cannot be edited", "read-only", "read only"):
              lock_state = any(t in all_text for t in ("note_lock", "islocked", "locked"))
              enforcement = any(t in java for t in ("setEnabled(false)", "setFocusable(false)", "setInputType(0)")) or "read-only" in all_text or "read only" in all_text
              persistence = any(t in java for t in ("store.flag(", "SharedPreferences"))
              if not (lock_state and enforcement and persistence):
                  failures.append("requested note lock/read-only behavior is not both persisted and enforced")

          if mentions("workout", "exercise") and mentions("weight", "reps"):
              if not all(t in all_text for t in ("exercise", "weight", "reps")):
                  failures.append("workout request lost exercise/weight/reps fields")
          if mentions("rpg", "growth", "stats") and mentions("workout", "exercise"):
              if not any(t in all_text for t in ("workout_xp", "level", "stat_strength", "stat_endurance", "growth")):
                  failures.append("requested automatic RPG/stat progression is missing")
              if "workout_xp" in all_text and not any(t in java for t in ("putNumber(\"workout_xp\"", "number(\"workout_xp\",")):
                  failures.append("workout XP exists only as display state and is not mutated/persisted")

          if failures:
              print("Generated request-fidelity gate failed:")
              for failure in failures:
                  print(f" - {failure}")
              sys.exit(1)
          print(f"PASS generated request-fidelity gate · app_name={app_name!r}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build generated debug APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-generated-apk-${{ github.run_id }}
          path: ${{ steps.root.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
