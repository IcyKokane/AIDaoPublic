name: Generated Project CI
run-name: AIDao generated ${{ github.event.client_payload.target_branch }}

on:
  repository_dispatch:
    types: [aidao-generated-build]

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}

jobs:
  build-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_BRANCH" =~ ^aidao-generated-[a-z0-9-]+-[0-9]+$ ]]; then
            echo "Invalid generated branch: $TARGET_BRANCH"
            exit 1
          fi

      - name: Checkout generated project
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build generated debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-generated-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
