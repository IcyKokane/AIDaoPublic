name: Generated Project CI
run-name: AIDao generated ${{ github.event.client_payload.target_branch }}

on:
  repository_dispatch:
    types: [aidao-generated-build]

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
  REQUESTED_PROJECT_ROOT: ${{ github.event.client_payload.project_root }}

jobs:
  build-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_BRANCH" =~ ^aidao-generated-[a-z0-9-]+-[0-9]+$ ]]; then
            echo "Invalid generated branch: $TARGET_BRANCH"
            exit 1
          fi
          if [[ -n "$REQUESTED_PROJECT_ROOT" && "$REQUESTED_PROJECT_ROOT" != ".aidao-generated-project" ]]; then
            echo "Invalid generated project root: $REQUESTED_PROJECT_ROOT"
            exit 1
          fi

      - name: Checkout generated project branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Resolve generated project root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ".aidao-generated-project/settings.gradle.kts" || -f ".aidao-generated-project/settings.gradle" ]]; then
            root=".aidao-generated-project"
          elif [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            # Backward-compatible with v0.5 acceptance branches while v1 transport rolls out.
            root="."
          else
            echo "No generated Android project root found"
            exit 1
          fi
          echo "project_root=$root" >> "$GITHUB_OUTPUT"
          echo "Resolved generated project root: $root"

      - name: Validate generated project boundary
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/settings.gradle.kts" -o -f "$PROJECT_ROOT/settings.gradle"
          test -f "$PROJECT_ROOT/app/build.gradle.kts" -o -f "$PROJECT_ROOT/app/build.gradle"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          if [[ -d "$PROJECT_ROOT/.github/workflows" ]]; then
            echo "Generated project may not supply executable GitHub workflows"
            exit 1
          fi

      - name: Normalize and validate generated Java source hygiene
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          src="$PROJECT_ROOT/app/src/main/java"
          if [[ -d "$src" ]]; then
            while IFS= read -r -d '' file; do
              # Defense in depth: collapse package qualifiers that a source-rewrite pass
              # may have accidentally applied more than once.
              while grep -qE 'android\.widget\.android\.widget\.|android\.graphics\.android\.graphics\.|android\.content\.android\.content\.|android\.app\.android\.app\.' "$file"; do
                sed -Ei \
                  -e 's/android\.widget\.android\.widget\./android.widget./g' \
                  -e 's/android\.graphics\.android\.graphics\./android.graphics./g' \
                  -e 's/android\.content\.android\.content\./android.content./g' \
                  -e 's/android\.app\.android\.app\./android.app./g' \
                  "$file"
              done
            done < <(find "$src" -type f -name '*.java' -print0)
            if grep -R -nE 'android\.widget\.android\.widget\.|android\.graphics\.android\.graphics\.|android\.content\.android\.content\.|android\.app\.android\.app\.' "$src"; then
              echo "Repeated Android package qualifier survived normalization"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build generated debug APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-generated-apk-${{ github.run_id }}
          path: ${{ steps.root.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
