name: Phone Native Mihon Acceptance

on:
  push:
    paths:
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/NativeFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/MihonBehaviorPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedFidelityValidator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityResearch.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityIntegrator.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneralProductPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GenericOfflinePostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/SemanticProductPostProcessor.java'
      - 'android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java'
      - 'acceptance/MihonExtensionCompatibilityAcceptance.java'
      - 'acceptance/PhoneNativeMihonBehaviorAcceptance.java'
      - 'acceptance/GenerateFidelitySampleProject.java'
      - '.github/workflows/phone-native-mihon-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-native-mihon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile semantic native-fidelity harness
        run: |
          rm -rf build/phone-native generated-phone-native
          mkdir -p build/phone-native generated-phone-native
          javac -d build/phone-native \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProject.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedProjectFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/NativeFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/MihonBehaviorPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneratedFidelityValidator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityResearch.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/ProviderCapabilityIntegrator.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GeneralProductPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/GenericOfflinePostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/SemanticProductPostProcessor.java \
            android-bootstrap/app/src/main/java/dev/thefoolish/aidao/LocalSourceGenerator.java \
            acceptance/MihonExtensionCompatibilityAcceptance.java \
            acceptance/PhoneNativeMihonBehaviorAcceptance.java \
            acceptance/GenerateFidelitySampleProject.java

      - name: Run behavioral and repository-safety acceptance
        run: |
          java -cp build/phone-native dev.thefoolish.aidao.MihonExtensionCompatibilityAcceptance
          java -cp build/phone-native dev.thefoolish.aidao.PhoneNativeMihonBehaviorAcceptance

      - name: Generate phone-native Mihon reference project
        run: |
          java -cp build/phone-native dev.thefoolish.aidao.GenerateFidelitySampleProject "$PWD/generated-phone-native"
          grep -R -q 'WindowInsets.Type.ime' generated-phone-native/app/src/main/java
          grep -R -q 'GridLayout' generated-phone-native/app/src/main/java
          grep -R -q 'Retry discovery' generated-phone-native/app/src/main/java
          grep -R -q 'Refresh library updates' generated-phone-native/app/src/main/java
          grep -R -q 'Continue watching' generated-phone-native/app/src/main/java
          grep -R -q 'https://api.jikan.moe/v4/anime' generated-phone-native/app/src/main/java
          grep -R -q 'https://graphql.anilist.co' generated-phone-native/app/src/main/java

      - name: Build generated phone-native APK
        working-directory: generated-phone-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload phone-native regression APK
        uses: actions/upload-artifact@v4
        with:
          name: aidao-phone-native-mihon-regression-apk
          path: generated-phone-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
