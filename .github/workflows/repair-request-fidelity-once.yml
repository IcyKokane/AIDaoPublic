name: Repair Request Fidelity Once

on:
  push:
    paths:
      - '.github/workflows/repair-request-fidelity-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair request classification without weakening semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java')
          s=p.read_text()
          old='boolean note = any(request, "notepad", "note app", "notes", "document editor");'
          new='boolean note = any(request, "notepad", "note app", "notes", "note-taking", "note taking");'
          if old not in s:
              raise SystemExit('note classifier target missing')
          s=s.replace(old,new,1)
          s=s.replace('boolean purple = request.contains("purple");','boolean purple = word(request, "purple");',1)
          s=s.replace('boolean red = request.contains("red");','boolean red = word(request, "red");',1)
          s=s.replace('boolean teal = request.contains("teal");','boolean teal = word(request, "teal");',1)
          s=s.replace('boolean orange = request.contains("orange");','boolean orange = word(request, "orange");',1)
          anchor='private static boolean any(String s, String... terms) { for (String x : terms) if (s.contains(x)) return true; return false; }'
          helper=anchor+'\n    private static boolean word(String s, String term) { return s != null && term != null && s.matches("(?s).*\\\\b" + java.util.regex.Pattern.quote(term) + "\\\\b.*"); }'
          if anchor not in s:
              raise SystemExit('helper anchor missing')
          s=s.replace(anchor,helper,1)
          p.write_text(s)
          PY
          git config user.name 'The Foolish One'
          git config user.email 'tomjunker45@gmail.com'
          git add android-bootstrap/app/src/main/java/dev/thefoolish/aidao/RequestFidelityPostProcessor.java
          git commit -m 'Tighten request fidelity classification boundaries'
          git push origin HEAD:main
